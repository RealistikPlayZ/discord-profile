<!Doctype HTML>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Me on Discord</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#313338;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

.card{
    width:360px;
    background:#232428;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(0,0,0,.45);
    animation:fade 0.8s ease;
}

.banner{
    height:120px;
    background:linear-gradient(135deg,#5865F2,#7B8CFF);
}

.profile{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:-55px;
    padding:0 25px 30px;
}

.profile img{
    width:110px;
    height:110px;
    border-radius:50%;
    border:6px solid #232428;
    object-fit:cover;
}

.display-name{
    font-size:24px;
    font-weight:bold;
    margin-top:15px;
}

.username{
    color:#B5BAC1;
    margin-top:5px;
    font-size:17px;
}

.divider{
    width:100%;
    height:1px;
    background:#3F4147;
    margin:25px 0;
}

.info{
    text-align:center;
}

.info h3{
    color:#FFFFFF;
    margin-bottom:12px;
}

.info p{
    color:#B5BAC1;
    line-height:1.6;
}

.username-box{
    display:block;
    text-decoration:none;
    margin-top:18px;
    background:#111214;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
    color:#5865F2;
    letter-spacing:.5px;
    transition:0.3s;
}

.username-box:hover{
    background:#5865F2;
    color:white;
    transform:scale(1.05);
}

.footer{
    margin-top:20px;
    color:#80848E;
    font-size:13px;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>

</head>
<body>

<div class="card">

    <div class="banner"></div>

    <div class="profile">

        <img src="Cartoon RealistikPlayZ Blue 4.0.png" alt="Profile Picture">

        <div class="display-name">RealistikPlayZ</div>

        <div class="username">@realistikplayz</div>

        <div class="divider"></div>

        <div class="info">

            <h3>Add me on Discord!</h3>

            <p>
                Discord doesn't currently support friend request links.
                Simply search for the username below inside Discord
                and send me a friend request.
            </p>

            <a class="username-box" href="https://discord.com/users/692102052871929937" target="_blank">
    		View Discord Profile
			</a>

            <div class="footer">
                Thanks for stopping by! 💙
            </div>

        </div>

    </div>

</div>

</body>
</html>
